[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-elo"
version = "0.1.0"
description = "Surface-aware Elo ratings and Grand Slam Monte Carlo for ATP tennis"
authors = [{ name = "Luke Wamalwa" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
