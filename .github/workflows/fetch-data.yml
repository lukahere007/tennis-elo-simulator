name: Fetch data

on:
  push:
    branches: [claude/github-projects-improve-nh2reo]
    paths:
      - scripts/fetch_data.py
      - .github/workflows/fetch-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pandas>=2.1" "pyarrow>=14"
      - name: Inspect source repository
        run: |
          curl -sS https://api.github.com/repos/JeffSackmann/tennis_atp | head -c 1500 || true
          curl -sS -o /dev/null -w "raw master 2023: %{http_code}\n" https://raw.githubusercontent.com/JeffSackmann/tennis_atp/master/atp_matches_2023.csv || true
          curl -sS -o /dev/null -w "raw main 2023: %{http_code}\n" https://raw.githubusercontent.com/JeffSackmann/tennis_atp/main/atp_matches_2023.csv || true
      - name: Download ATP matches
        run: python scripts/fetch_data.py
      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atp_matches.parquet
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update ATP match data (automated fetch)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
